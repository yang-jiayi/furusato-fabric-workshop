<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="d6-title d6-desc" preserveAspectRatio="xMidYMid meet">
<title id="d6-title">Ontology と Data Agent の PoC から本番運用へ — 4 つのゲート (v2.7.0)</title>
<desc id="d6-desc">Ontology と Data Agent に限定した PoC から本番運用への 4 ゲート図。ゲート 1 は Ontology 設計の承認で、業務質問、粒度、エンティティ境界、関係の方向と意味境界を確定する。出口条件は概念モデルと意味境界レジスタの承認である。ゲート 2 はバインディングとメタデータの整合で、静的バインディングと時系列バインディング、キー解決、件数照合、セマンティックメタデータの適用を行う。出口条件はノード数とエッジ数と定義の一致である。ゲート 3 は Data Agent の構成と評価で、3 ソースの層別ルーティング、用語、境界、安全方針を設定し、held-out の評価に合格することが出口条件である。ゲート 4 は公開と運用で、発行版、最小権限共有、鮮度確認、スモークテスト、1 ページの Runbook を用意し、ロールバックが実行可能であることが出口条件である。各ゲートには担当ロールと最小成果物が示され、下部にはゲートを戻すフォールバック経路と、直前の発行版へ戻すロールバックが赤の破線で示されている。対象は Ontology と Data Agent に限定し、全社的な容量管理や詳細な体制設計は含めない。</desc>

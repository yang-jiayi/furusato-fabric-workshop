<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title description">
  <title id="title">Furusato: make data mean more</title>
  <desc id="description">Illustrated cover for the Microsoft Fabric IQ Ontology Workshop. Connect Lakehouse SQL, Eventhouse KQL and Ontology GQL to one Data Agent. Learn with synthetic data and verify answers against executed queries. The orbital artwork is decorative, not a screenshot or execution result.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071419"/>
      <stop offset=".57" stop-color="#0b202a"/>
      <stop offset="1" stop-color="#16243a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#cbffe2"/>
      <stop offset=".56" stop-color="#77e8ca"/>
      <stop offset="1" stop-color="#89b9ff"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#27c5a9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#27c5a9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop stop-color="#8272eb" stop-opacity=".17"/>
      <stop offset="1" stop-color="#8272eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173d45"/>
      <stop offset="1" stop-color="#0d2735"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86f5cf"/>
      <stop offset=".5" stop-color="#64c5d6"/>
      <stop offset="1" stop-color="#9e99f4"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9bc9cd" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1440" height="600" rx="28" fill="url(#canvas)"/>
  <rect width="1440" height="600" rx="28" fill="url(#grid)"/>
  <ellipse cx="1110" cy="255" rx="380" ry="305" fill="url(#aura)"/>
  <ellipse cx="1300" cy="510" rx="390" ry="265" fill="url(#violet)"/>
  <path d="M28 1H1412" stroke="#6ccbb4" stroke-opacity=".42"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(64 46)">
      <rect width="30" height="30" rx="9" fill="#83e9c5" fill-opacity=".12" stroke="#83e9c5" stroke-opacity=".5"/>
      <path d="M8 20V10H22M8 15H18" fill="none" stroke="#b6fbdc" stroke-width="2.5" stroke-linecap="round"/>
      <text x="45" y="21" fill="#c2ddd9" font-size="15" font-weight="600" letter-spacing="2.8">FURUSATO / FABRIC IQ</text>
    </g>
    <text x="64" y="190" fill="#f0f9f7" font-size="91" font-weight="750" letter-spacing="-4">MAKE DATA</text>
    <text x="60" y="287" fill="url(#mint)" font-size="91" font-weight="750" letter-spacing="-4">MEAN MORE.</text>
    <text x="67" y="338" fill="#c0d1d7" font-size="22">From data engineering to grounded AI answers.</text>
    <text x="67" y="372" fill="#8ba8b4" font-size="20">Build it. Ask it. Trace the evidence.</text>

    <g transform="translate(65 418)">
      <rect width="135" height="35" rx="17.5" fill="#b8f4d5"/>
      <text x="67.5" y="23" text-anchor="middle" fill="#0b2825" font-size="13" font-weight="700" letter-spacing="1.2">HANDS-ON LAB</text>
      <rect x="147" width="94" height="35" rx="17.5" fill="#14333d" stroke="#365561"/>
      <text x="194" y="23" text-anchor="middle" fill="#d7e6ed" font-size="14" font-weight="600">JP / EN</text>
      <text x="263" y="23" fill="#91aeb8" font-size="14">v2.7.0 / unified</text>
    </g>

    <g fill="none" stroke="url(#orbit)">
      <circle cx="1080" cy="265" r="174" stroke-opacity=".24"/>
      <circle cx="1080" cy="265" r="213" stroke-opacity=".1" stroke-dasharray="3 11"/>
      <ellipse cx="1080" cy="265" rx="211" ry="81" transform="rotate(-34 1080 265)" stroke-width="1.7" stroke-opacity=".8"/>
      <ellipse cx="1080" cy="265" rx="211" ry="81" transform="rotate(34 1080 265)" stroke-width="1.7" stroke-opacity=".55"/>
      <ellipse cx="1080" cy="265" rx="78" ry="192" stroke-width="1.2" stroke-opacity=".4"/>
      <path d="M917 198 1080 265 1250 332M929 350 1080 265 1236 153" stroke-opacity=".26"/>
    </g>
    <g fill="#a6f1da">
      <circle cx="917" cy="198" r="5"/>
      <circle cx="1250" cy="332" r="5"/>
      <circle cx="929" cy="350" r="4"/>
      <circle cx="1080" cy="74" r="4"/>
    </g>
    <g fill="#a7b8ff">
      <circle cx="1236" cy="153" r="5"/>
      <circle cx="1080" cy="456" r="4"/>
      <circle cx="870" cy="286" r="3"/>
    </g>

    <rect x="970" y="195" width="220" height="145" rx="24" fill="#051b24" fill-opacity=".35"/>
    <rect x="970" y="185" width="220" height="145" rx="24" fill="url(#glass)" stroke="#8bdec6" stroke-opacity=".7"/>
    <path d="M993 185H1167" stroke="#bdffe4" stroke-opacity=".65"/>
    <g fill="none" stroke="#b8f8dc" stroke-width="1.6">
      <path d="M1019 218 1032 231 1019 244 1006 231Z"/>
      <path d="M1019 218V210M1006 231H998M1032 231H1040"/>
    </g>
    <text x="995" y="276" fill="#eefbf6" font-size="28" font-weight="650" letter-spacing="-.6">Data Agent</text>
    <text x="996" y="302" fill="#8fb7b8" font-size="14">ONE AGENT. THREE SOURCES.</text>

    <g transform="translate(827 123)">
      <rect width="134" height="43" rx="12" fill="#142e3b" stroke="#507e98"/>
      <circle cx="20" cy="21.5" r="4" fill="#8acaff"/>
      <text x="34" y="27" fill="#d8eaff" font-size="15" font-weight="600">SQL</text>
      <text x="77" y="27" fill="#88a6b8" font-size="12">static</text>
    </g>
    <g transform="translate(1190 100)">
      <rect width="150" height="43" rx="12" fill="#262c4a" stroke="#77709f"/>
      <circle cx="20" cy="21.5" r="4" fill="#b3a8ff"/>
      <text x="34" y="27" fill="#e4dfff" font-size="15" font-weight="600">KQL</text>
      <text x="79" y="27" fill="#aaa4c3" font-size="12">events</text>
    </g>
    <g transform="translate(1143 393)">
      <rect width="171" height="43" rx="12" fill="#103930" stroke="#488e74"/>
      <circle cx="20" cy="21.5" r="4" fill="#98ebbc"/>
      <text x="34" y="27" fill="#d2fce3" font-size="15" font-weight="600">GQL</text>
      <text x="80" y="27" fill="#92bba5" font-size="12">relationships</text>
    </g>

    <path d="M64 498H1376" stroke="#9bbdc6" stroke-opacity=".2"/>
    <g font-size="15" letter-spacing=".4">
      <text x="66" y="550" fill="#a5c0c8"><tspan fill="#e4f3ef" font-weight="700">10</tspan> ENTITIES</text>
      <text x="287" y="550" fill="#a5c0c8"><tspan fill="#e4f3ef" font-weight="700">15</tspan> RELATIONSHIPS</text>
      <text x="575" y="550" fill="#a5c0c8">SYNTHETIC DATA</text>
      <text x="1374" y="550" text-anchor="end" fill="#c9eee0" font-weight="600">A WORKSHOP YOU CAN BUILD, QUERY &amp; VERIFY</text>
    </g>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="ol-title ol-desc" preserveAspectRatio="xMidYMid meet">
<title id="ol-title">Ontology 変更を提案する生成 AI を評価するときのライフサイクル (v2.7.0)</title>
<desc id="ol-desc">Ontology の変更を提案する生成 AI を評価するための一般的なライフサイクル図。左から右へ 5 つの工程が並ぶ。工程 1 は証拠の発見とスコープ確定で、業務の問いと利用できるソースを洗い出し、対象範囲と粒度を人の言葉で固定し、既存の意味の境界を読み直す。出口条件はスコープと粒度が文章で書かれていること。工程 2 はドメイン設計と意味の境界で、エンティティ・関係・キーを人が決め、安定した識別子と明示的な外部キーを選び、生成された提案を素案として扱う。出口条件は意味の境界の所有者が人であること。工程 3 は構造とグラウンディングの検証で、キー・方向・件数を実データで照合し、どのソースに基づく回答かを明示し、セマンティックモデルの参照とオントロジーの束縛を区別する。出口条件は件数と方向が期待値と一致すること。工程 4 は読み取り専用プレビューと確認で、変更案を読み取り専用で提示させ、承認するまで既存の定義を変えず、未適用の下書きが残る前提を置かない。出口条件は設計者以外の人が内容を読んでいること。工程 5 は明示的な書き込みゲートで適用し、人が明示的に許可したときだけ適用し、適用後に件数と契約を再検証し、既存の識別子を保持して差分適用を選ぶ。出口条件は適用前後の状態が記録されていること。下部の帯は人による確認が自動化できないことを示し、工程 4 から工程 2 へ戻る赤い破線の差し戻し経路が描かれている。さらに下部には、本ワークショップでの位置づけとして Core の手順が第 8 章から第 9 章の手動作成のままであること、およびここで固定しない事項として画面名・上限値・保持期間・機能別の準拠範囲・課金条件を最新の公式ドキュメントで確認することが示されている。</desc>
